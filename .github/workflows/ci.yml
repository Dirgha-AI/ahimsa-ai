name: AIA v1.1 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Validate Recursive JSON Schema v1.1 (50 Benchmark Systems + Examples)
      run: |
        python validate_schema.py

    - name: Run Stage 1 AIA v1.1 Unit Tests (13 Tests)
      run: |
        python tests/test_scorer.py

    - name: Run 50-System Benchmark & 1,000-Trial Monte Carlo Sensitivity
      run: |
        python benchmark/run_benchmark.py

    - name: Run 20 Real-World Historical AI Disasters Retrospective Validation
      run: |
        python benchmark/run_historical_disasters.py

    - name: Run 4-Pillar Macroeconomic Calibration Simulator
      run: |
        python macro/sim_abundance_macro.py
