[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ahimsa-ai"
version = "1.1.0"
description = "Ahimsa Impact Assessment (AIA v1.1): Dual-axis evaluation of non-extraction (Himsa risk) and affirmative flourishing (Sarvodaya) with RFC 8785 LOKAHI manifest compilation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Salik Shah", email = "salik.shah@gmail.com"}
]
keywords = ["ai-safety", "algorithmic-impact-assessment", "ahimsa", "sarvodaya", "lokahi", "governance", "dpi", "synthetic-humanism"]
